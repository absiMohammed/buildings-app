services:
  - type: web
    name: building-app-server
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci --include=dev && npm --workspace server run build
    startCommand: npm --workspace server run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "10000"
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 1h
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: DEVICE_WS_TOKEN
        sync: false
      - key: BCRYPT_COST
        value: "12"
      - key: EMAIL_PROVIDER
        value: console
      - key: EMAIL_FROM
        value: Building App <noreply@example.com>
      - key: RESEND_API_KEY
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_DIR
        value: ./uploads
      - key: SEED_BUILDING_NAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: building-app-client
    runtime: static
    rootDir: .
    buildCommand: npm ci --include=dev && npm --workspace client run build
    staticPublishPath: client/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://building-app-server.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
