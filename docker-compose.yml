version: "3.9"
services:
  mongo:
    image: mongo:7
    container_name: building-app-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mailhog:
    image: mailhog/mailhog:latest
    container_name: building-app-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

volumes:
  mongo-data:
